<title>Overdrive: Cyber Slash</title>

<style>
/* Layout: one full-bleed canvas inside the safe area; DOM overlays are a single centered column (max 440px) */
:root {
  --bg: #05060f; --panel: #0b1024; --panel2: #10183a; --line: #23305e; --fg: #e8fbff; --mute: #8fa4c8;
  --cyan: #00f2fe; --pink: #ff2bd6; --red: #ff0844; --gold: #ffd700; --green: #00ff88; --violet: #a66bff;
  --fd: 'Chakra Petch', 'Rubik', 'Cairo', 'Segoe UI', system-ui, sans-serif; --fb: 'Rajdhani', 'Rubik', 'Cairo', 'Segoe UI', system-ui, sans-serif; --fm: 'Share Tech Mono', 'Rubik', 'Cairo', ui-monospace, monospace;
  --cut: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  color-scheme: dark; box-sizing: border-box; height: 100%; background: var(--bg);
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; height: 100%; position: relative; overflow: hidden; background: var(--bg); color: var(--fg); font: 600 16px/1.35 var(--fb);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

#c3d { position: absolute; inset: 0; width: 100%; height: 100%; display: none; pointer-events: none; }
#sa { position: absolute; visibility: hidden; pointer-events: none; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.hidden { display: none !important; }

/* ---------- in-game controls ---------- */
#pauseBtn { position: absolute; top: 10px; right: max(10px, env(safe-area-inset-right, 0px)); width: 44px; height: 44px; z-index: 6;
  background: rgba(8, 12, 30, .8); border: 1px solid var(--line); clip-path: var(--cut); color: var(--fg); font: 700 15px var(--fd); letter-spacing: 1px; }
#emoBtn { position: absolute; top: 60px; right: max(10px, env(safe-area-inset-right, 0px)); width: 44px; height: 44px; z-index: 6; background: rgba(8, 12, 30, .8); border: 1px solid var(--line); clip-path: var(--cut); font-size: 20px; }
.emoMenu { position: absolute; top: 110px; right: max(10px, env(safe-area-inset-right, 0px)); z-index: 7; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.emoMenu button { background: rgba(8, 12, 30, .92); border: 1px solid #ff4fd8; color: #fff; font: 800 12px var(--fd); padding: 10px 12px; clip-path: var(--cut); }
#dock { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; gap: 6px; direction: ltr;
  padding: 8px max(10px, env(safe-area-inset-right, 0px)) 10px max(10px, env(safe-area-inset-left, 0px)); max-width: 520px; margin: 0 auto; pointer-events: none; }
.sk { pointer-events: auto; position: relative; flex: 1 1 0; max-width: 98px; height: var(--skh, 58px); background: rgba(8, 12, 30, .86); border: 1px solid var(--line); clip-path: var(--cut);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: var(--fg); touch-action: manipulation; }
.sk svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sk .n { font: 700 10px var(--fd); letter-spacing: .5px; }
body.hudclean .sk .n { display: none; } body.hudclean .sk .t { font-size: 12px; color: var(--ink, #e8fbff); }
.sk .t { font: 11px var(--fm); color: var(--mute); }
.sk[data-k="grapple"] { color: var(--green); } .sk[data-k="hijack"] { color: var(--cyan); } .sk[data-k="web"] { color: var(--gold); } .sk[data-k="echo"] { color: var(--violet); } .sk[data-k="od"] { color: var(--pink); }
.sk.cd { opacity: .45; } .sk.off { opacity: .18; }
.sk .fill { position: absolute; left: 0; bottom: 0; width: 100%; height: 0; background: currentColor; opacity: .14; pointer-events: none; }
.sk.ready { border-color: var(--gold); background: linear-gradient(135deg, #ff0844, #7928ca); color: #fff; animation: pulse .6s infinite alternate; }
#bootCv { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
#s-boot .boot-col { position: relative; z-index: 1; gap: 12px; }
.boot-logo { animation: bootIn .9s cubic-bezier(.2, 1.4, .4, 1) both; }
.boot-logo.cut .o { animation: bootCut .5s ease-out; }
@keyframes bootIn { from { opacity: 0; transform: scale(1.6); filter: blur(8px); } }
@keyframes bootCut { 0% { filter: brightness(3) drop-shadow(0 0 18px #fff); transform: skewX(-12deg); } 100% { filter: none; transform: none; } }
.boot-blade { display: flex; align-items: center; width: min(340px, 86vw); margin: 4px auto 0; filter: drop-shadow(0 0 8px rgba(0, 242, 254, .55)); }
.boot-blade .hilt { width: 46px; height: 12px; background: repeating-linear-gradient(90deg, #2a3150 0 6px, #d9b46a 6px 8px); border-radius: 3px 0 0 3px; }
.boot-blade .hilt::after { content: ''; display: block; position: relative; left: 44px; top: -6px; width: 6px; height: 24px; background: #d9b46a; border-radius: 2px; }
.boot-blade .edge { flex: 1; height: 8px; margin-left: 6px; background: rgba(255, 255, 255, .06); clip-path: polygon(0 0, 100% 40%, 100% 60%, 0 100%); overflow: hidden; }
.boot-blade .edge i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #00f2fe, #e8fbff 70%, #ff2bd6); box-shadow: 0 0 12px #00f2fe; transition: width .08s linear; }
.boot-blade .tip { width: 0; height: 0; border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-left: 14px solid rgba(255, 255, 255, .25); }
.boot-row { display: flex; justify-content: space-between; align-items: baseline; width: min(340px, 86vw); margin: 0 auto; }
.boot-pct { font: italic 700 28px var(--fd); color: var(--fg); text-shadow: 0 0 12px var(--cyan); }
.boot-term { min-height: 0; height: 64px; overflow: hidden; font-size: 11px; opacity: .85; background: rgba(4, 8, 18, .5); width: min(340px, 86vw); margin: 0 auto; }
.boot-tip { min-height: 38px; font: 13px/1.4 var(--fm); color: var(--mute); width: min(340px, 86vw); margin: 0 auto; transition: opacity .3s; }
#bootGo { animation: bootGo .9s ease-in-out infinite alternate; }
@keyframes bootGo { from { box-shadow: 0 0 0 rgba(255, 8, 68, 0); } to { box-shadow: 0 0 28px rgba(255, 8, 68, .7); } }
@keyframes pulse { from { filter: brightness(1); } to { filter: brightness(1.35); } }
.sk:active { transform: scale(.94); }
body.lefty #dock { flex-direction: row-reverse; }
#dock { opacity: var(--bop, 1); } body.hudedit #dock { opacity: 1; }
.hudedit-ov { position: fixed; inset: 0; z-index: 60; background: rgba(3, 4, 10, .78); display: flex; flex-direction: column; align-items: center; gap: 10px; padding: calc(24px + env(safe-area-inset-top, 0px)) 16px 16px; text-align: center; }
.hudedit-ov .grid2 { width: min(340px, 100%); }
body.hudedit #dock { z-index: 61; } body.hudedit .sk { outline: 2px dashed var(--gold); outline-offset: 2px; cursor: grab; touch-action: none; animation: none; }
#replayBar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 7; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px;
  padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); background: linear-gradient(transparent, rgba(3, 4, 10, .92) 30%); }
#replayBar .rb-top { display: flex; justify-content: space-between; gap: 8px; font: 700 12px var(--fm); color: var(--cyan); }
#replayBar .rb-prog { height: 4px; background: rgba(255, 255, 255, .12); } #replayBar .rb-prog i { display: block; height: 100%; width: 0; background: var(--cyan); }
#replayBar .rb-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
#replayBar button { min-height: 44px; background: rgba(8, 12, 30, .9); border: 1px solid var(--line); clip-path: var(--cut); font: 700 13px var(--fd); color: var(--fg); }
#replayBar button:disabled { opacity: .35; }

/* ---------- overlays ---------- */
#ov { position: absolute; inset: 0; z-index: 10; overflow: hidden; }
body.tz #ov > .scr:not(.photo):not(.comic) { zoom: var(--tz, 1); } body.tz #ov .logo { zoom: calc(1 / var(--tz, 1)); }
.scr { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
  padding-block: 18px 22px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(120% 80% at 50% 20%, rgba(16, 24, 58, .82), rgba(3, 4, 10, .94)); animation: scrIn .22s ease-out; }
.scr.clear { background: rgba(3, 4, 10, .55); }
.scr.center { justify-content: flex-start; }
.scr > .col { margin-block: auto; }
@keyframes scrIn { from { opacity: 0; transform: translateY(10px); } }
.col { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; } .row > * { flex: 1; min-width: 0; }
.eyebrow { font: 13px var(--fm); color: var(--cyan); letter-spacing: 2px; text-transform: uppercase; }
h1, h2 { font-family: var(--fd); font-weight: 700; margin: 0; letter-spacing: 2px; text-wrap: balance; }
h1 { font-size: 30px; } h2 { font-size: 22px; }
.mute { color: var(--mute); } .gold { color: var(--gold); } .small { font-size: 13px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 10px 16px; clip-path: var(--cut);
  background: var(--panel2); border: 1px solid var(--line); font: 700 16px var(--fd); letter-spacing: 1.5px; color: var(--fg); text-transform: uppercase; touch-action: manipulation; }
.btn.pri { background: linear-gradient(135deg, #ff0844, #7928ca); border: 0; min-height: 58px; font-size: 19px; box-shadow: 0 0 24px rgba(255, 8, 68, .35); }
.btn.gold { background: linear-gradient(135deg, #ffb300, #ff5500); color: #1a0a00; border: 0; }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--mute); min-height: 44px; font-size: 14px; }
.btn:active { transform: translateY(1px) scale(.99); filter: brightness(1.2); }
.btn[disabled] { opacity: .4; pointer-events: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; background: rgba(255, 255, 255, .05); border: 1px solid var(--line); font: 13px var(--fm); clip-path: var(--cut); }
.panel { background: rgba(11, 16, 36, .88); border: 1px solid var(--line); padding: 12px; clip-path: var(--cut); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; } #arDiff, #stDiff { grid-template-columns: repeat(5, 1fr); } #arDiff button, #stDiff button { font-size: 10.5px; padding: 9px 1px; letter-spacing: 0; }
.seg button { padding: 9px 4px; background: rgba(255, 255, 255, .04); border: 1px solid var(--line); clip-path: var(--cut); font: 700 12px var(--fd); letter-spacing: .5px; color: var(--mute); }
.seg button.on { color: var(--fg); border-color: var(--gold); background: rgba(255, 215, 0, .1); }
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; text-align: start; padding: 12px; background: rgba(11, 16, 36, .9); border: 1px solid var(--line); clip-path: var(--cut); color: var(--fg); }
.item .nm { font: 700 15px var(--fd); letter-spacing: .5px; min-width: 0; }
.item .ds { grid-column: 1 / -1; font-size: 14px; color: var(--mute); line-height: 1.3; }
.item .pr { font: 13px var(--fm); color: var(--gold); white-space: nowrap; }
.item.on { border-color: var(--gold); background: rgba(255, 215, 0, .07); }
.item.lock { opacity: .5; }
.stars { font-size: 15px; letter-spacing: 2px; color: #3a4466; } .stars b { color: var(--gold); font-weight: 400; }

/* title */
.logo { text-align: center; padding-top: 10px; }
.logo .o { position: relative; display: inline-block; font: italic 700 clamp(44px, 13vw, 64px)/1 var(--fd); letter-spacing: 3px; color: var(--fg); }
.logo .o::before, .logo .o::after { content: attr(data-t); position: absolute; inset: 0; mix-blend-mode: screen; }
.logo .o::before { color: var(--red); transform: translate(-2px, 0); animation: gl 3.2s infinite steps(1); }
.logo .o::after { color: var(--cyan); transform: translate(2px, 0); animation: gl 2.7s infinite steps(1) reverse; }
@keyframes gl { 0%, 86%, 100% { clip-path: inset(0 0 0 0); } 88% { clip-path: inset(30% 0 45% 0); transform: translate(-5px, 0); } 92% { clip-path: inset(60% 0 10% 0); transform: translate(4px, 0); } }
.logo.v2 .emb { display: block; width: 72px; height: 40px; margin: 0 auto 2px; filter: drop-shadow(0 0 8px rgba(255,210,63,.7)); }
.logo.v2 .word { position: relative; display: inline-block; direction: ltr; }
.logo.v2 .o.h1 { clip-path: polygon(0 0, 100% 0, 100% 34%, 0 70%); transform: translate(-3px, -2px); }
.logo.v2 .o.h2 { position: absolute; left: 0; top: 0; clip-path: polygon(0 70%, 100% 34%, 100% 100%, 0 100%); transform: translate(3px, 2px); }
.logo.v2 .cut { position: absolute; left: -7%; right: -7%; top: calc(52% - 1.5px); height: 3px; border-radius: 3px; background: linear-gradient(90deg, transparent, #ffffff 18%, #7ffaff 50%, #ffffff 82%, transparent); box-shadow: 0 0 10px #00f2fe, 0 0 22px #00f2fe; transform: rotate(-4.1deg); animation: logocut .7s cubic-bezier(.2, .9, .3, 1) both; }
@keyframes logocut { 0% { transform: rotate(-4.1deg) scaleX(0); opacity: 1; } 70% { opacity: 1; } 100% { transform: rotate(-4.1deg) scaleX(1); opacity: .9; } }
@media (prefers-reduced-motion: reduce) { .logo.v2 .cut { animation: none; } }
.logo .s { display: block; font: 700 18px var(--fd); letter-spacing: 9px; color: var(--red); margin-top: 6px; }
.slashline { height: 2px; background: linear-gradient(90deg, transparent, var(--cyan), var(--pink), transparent); margin: 10px auto 0; width: 70%; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.scr.enter > .col { animation: scrIn .32s cubic-bezier(.2, .9, .3, 1) both; }
.scr.enter > .col > * { animation: cardIn .38s cubic-bezier(.2, .9, .3, 1) both; }
.scr.enter > .col > *:nth-child(2) { animation-delay: .03s; } .scr.enter > .col > *:nth-child(3) { animation-delay: .06s; } .scr.enter > .col > *:nth-child(4) { animation-delay: .09s; }
.scr.enter > .col > *:nth-child(5) { animation-delay: .12s; } .scr.enter > .col > *:nth-child(6) { animation-delay: .15s; } .scr.enter > .col > *:nth-child(n+7) { animation-delay: .18s; }
@keyframes scrIn { from { clip-path: polygon(0 0, 0 0, -20% 100%, -20% 100%); } to { clip-path: polygon(0 0, 120% 0, 100% 100%, -20% 100%); } }
@keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
#s-result.enter #rsTitle { animation: slam .5s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes slam { 0% { transform: scale(2.2); opacity: 0; letter-spacing: 12px; } 60% { opacity: 1; } 100% { transform: scale(1); letter-spacing: inherit; } }
#rsStats b.cnt { position: relative; color: transparent; } #rsStats b.cnt::after { content: attr(data-show); position: absolute; inset: 0; color: var(--fg); }
@media (prefers-reduced-motion: reduce) { .scr.enter > .col, .scr.enter > .col > *, #s-result.enter #rsTitle { animation: none; } }
.tierchip { --tc: #9aa7c0; display: inline-block; font: 700 10px var(--fm); letter-spacing: 1.5px; color: var(--tc); border: 1px solid var(--tc); padding: 1px 6px; border-radius: 3px; background: color-mix(in srgb, var(--tc) 14%, transparent); text-shadow: 0 0 8px color-mix(in srgb, var(--tc) 60%, transparent); }
.item.shop.tiered { border-inline-start: 3px solid var(--tc); } .item.shop .tierchip { grid-column: 2; justify-self: start; margin-top: 2px; }
.tierline { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-weight: 700; color: var(--fg); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid2.tiles { grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grid2.tiles > .btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 76px; padding: 10px 4px; font-size: 12px; letter-spacing: 1px; line-height: 1.15; }
.grid2.tiles > .btn svg.ti { width: 26px; height: 26px; fill: none; stroke: var(--cyan, #00f2fe); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 6px rgba(0,242,254,.55)); }
.grid2.tiles > .btn:nth-child(3n+2) svg.ti { stroke: #ff4fd8; filter: drop-shadow(0 0 6px rgba(255,79,216,.55)); } .grid2.tiles > .btn:nth-child(3n) svg.ti { stroke: #ffd23f; filter: drop-shadow(0 0 6px rgba(255,210,63,.5)); }
.grid2.tiles > .season-btn { flex-direction: column; } .grid2.tiles > .season-btn .chip { font-size: 10px; padding: 2px 6px; }

.bty { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 14px; padding: 7px 0; border-bottom: 1px solid rgba(255, 255, 255, .06); }
.bty:last-child { border-bottom: 0; }
.bar { height: 4px; background: rgba(255, 255, 255, .08); grid-column: 1 / -1; } .bar i { display: block; height: 100%; background: var(--cyan); }
.daily { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: start; }
.chips { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
button.chip { color: var(--fg); min-height: 34px; } button.chip.gold { color: var(--gold); border-color: rgba(255, 215, 0, .5); }

/* story map */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.tabs button { padding: 8px 2px; border: 1px solid var(--line); background: rgba(255, 255, 255, .03); clip-path: var(--cut); color: var(--mute); font: 700 11px var(--fd); }
.tabs button b { display: block; font-size: 16px; color: var(--fg); }
.tabs button.on { border-color: var(--cyan); background: rgba(0, 242, 254, .08); }
.tabs button.lock { opacity: .4; }
.tabs button.bonus b { color: var(--gold); }
#stNG.on { color: var(--gold); border-color: var(--gold); background: rgba(255, 215, 0, .08); }
.stage { display: grid; grid-template-columns: 52px 1fr auto; gap: 2px 12px; align-items: center; padding: 12px; text-align: start; background: rgba(11, 16, 36, .9); border: 1px solid var(--line); clip-path: var(--cut); }
.stage .id { grid-row: span 2; font: 700 22px var(--fd); color: var(--cyan); text-align: center; }

.stage.lock { opacity: .45; } .stage.boss .id { color: var(--red); }

/* results */
.big-stars { display: flex; justify-content: center; gap: 14px; font-size: 44px; line-height: 1; }
.big-stars span { color: #2a3150; transform: scale(.4); opacity: 0; animation: starIn .35s cubic-bezier(.2, 1.6, .4, 1) forwards; }
.big-stars span.on { color: var(--gold); text-shadow: 0 0 18px rgba(255, 215, 0, .8); }
@keyframes starIn { to { transform: scale(1); opacity: 1; } }
.stat { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat div { background: rgba(255, 255, 255, .04); border: 1px solid var(--line); padding: 8px 10px; clip-path: var(--cut); font-size: 13px; color: var(--mute); }
.stat b { display: block; font: 700 18px var(--fd); color: var(--fg); font-variant-numeric: tabular-nums; }
.newbest { text-align: center; font: 700 14px var(--fd); color: var(--gold); letter-spacing: 3px; animation: pulse .5s infinite alternate; }

/* perk cards */
.perk { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; text-align: start; padding: 14px; border: 1px solid var(--line); background: rgba(11, 16, 36, .94); clip-path: var(--cut); }
.perk .rar { font: 12px var(--fm); letter-spacing: 1.5px; }
.perk .nm { font: 700 18px var(--fd); grid-column: 1 / -1; }
.perk .ds { font-size: 15px; color: var(--mute); grid-column: 1 / -1; }
.perk .lv { font: 12px var(--fm); color: var(--mute); }
.perk.syn { box-shadow: 0 0 22px rgba(255, 43, 214, .35) inset; background: linear-gradient(135deg, rgba(60, 8, 52, .95), rgba(11, 16, 36, .94)); }
.perk .syn-tag { grid-column: 1 / -1; font: 700 11px var(--fm); color: #ff2bd6; letter-spacing: .5px; }
.item .ms { grid-column: 1 / -1; font: 11px var(--fm); color: var(--gold); line-height: 1.35; }
.item .mbar { grid-column: 1 / -1; display: block; height: 3px; background: rgba(255, 255, 255, .1); }
.item .mbar i { display: block; height: 100%; background: var(--gold); }
.item .ms.sg { color: var(--mute); font-size: 11px; } .item .ms.sg.on { color: #ff9ad8; }
.set-h { padding-top: 14px; }

/* =====================================================================
   NO SIDEWAYS SHIFT (version 40.1). On a phone, anything that sticks out
   past the screen edge, even for a moment, makes the browser widen the
   whole page, and the menus then sit off to one side until the app is
   restarted. The achievement popup did this: it was centered with
   left: 50% and pulled back with a transform, but its untransformed box
   reached past the right edge.
   · the popup is centered without leaving the screen (left/right 0,
     margin auto) and only moves up and down
   · the page clips everything to the screen, so no other element can
     widen it again
   ===================================================================== */
html { overflow: hidden; height: 100%; overscroll-behavior: none; }
body { overflow: hidden; overflow: clip; width: 100%; max-width: 100vw; overscroll-behavior: none; }
#ov, .scr { overflow-x: hidden; }
#achPop { left: 0; right: 0; margin-inline: auto; width: fit-content; max-width: calc(100% - 32px); transform: translateY(-140%); overflow: hidden; }
#achPop.show { transform: none; }
body.inrun #achPop { max-width: calc(100% - 150px); transform: translateY(-60px); }
body.inrun #achPop.show { transform: none; }
